<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Almeplan | Planejamento e Gerenciamento de Projetos</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f4f7fa;
      color:#1f2937;
      line-height:1.6;
    }

    header{
      background:linear-gradient(135deg,#0B2A45,#0B7B72);
      color:white;
      padding:80px 20px;
      text-align:center;
    }

    header h1{
      font-size:52px;
      margin-bottom:20px;
    }

    header p{
      max-width:700px;
      margin:auto;
      font-size:20px;
    }

    .btn{
      display:inline-block;
      margin-top:30px;
      background:white;
      color:#0B2A45;
      padding:15px 28px;
      border-radius:40px;
      text-decoration:none;
      font-weight:bold;
    }

    section{
      padding:70px 20px;
    }

    .container{
      max-width:1200px;
      margin:auto;
    }

    .title{
      text-align:center;
      margin-bottom:50px;
    }

    .title h2{
      font-size:38px;
      color:#0B2A45;
      margin-bottom:10px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 8px 25px rgba(0,0,0,0.08);
    }

    .card img{
      width:100%;
      height:180px;
      object-fit:cover;
    }

    .card-content{
      padding:25px;
    }

    .card h3{
      color:#0B2A45;
      margin-bottom:10px;
    }

    .steps{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .step{
      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:0 5px 18px rgba(0,0,0,0.06);
    }

    .number{
      width:45px;
      height:45px;
      border-radius:50%;
      background:#0B7B72;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
      margin-bottom:15px;
    }
